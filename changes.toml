[[items]]
id = "FEAT-rvd-detect-classes"
kind = "feature"
title = "rvd/rmd: per-class Detect, tracking gate, Notify/Record per class"
why = "With algorithm = yolo any detection set ivs-status motion, which rmd (recording), raptor-motion-watch (send2) and rhkd (HomeKit sensor, HKSV) all follow: a parked car seen as vehicle kept the v4's HomeKit motion sensor firing all morning (2026-11-25). `classes = person,pet` (names from class_names, or ids; unset = every class, nothing resolved = every class + warning) limits motion to those classes. ivs-detections keeps every detection (+ \"enabled\"), ivs-status adds class_mask for per-class actions in rmd (Phase 2 next step)."
status = "local"
part_of = ["GOAL-local-ai"]
devices = ["wyze-cam-v3", "wyze-cam-v4"]
tested = "2026-11-25 11:34, Wyze Cam v4 (image 20261125-0924, rvd bind-mounted from /tmp/xb, owner approved), classes = person,pet,package: the parked car still detected (vehicle, enabled false) with motion false and rhkd 'motion cleared'; a person at 11:35:09 raised motion (class_mask 1) and rhkd 'motion detected'. rvd 228,332 -> 232,436 bytes. 2026-11-25 11:47, v4, tracking gate d44e8be (owner: Detect vs motion are different things), classes empty (all detected): the parked car new at restart, still after 10 s, motion off, rhkd motion cleared 11:47:56, same track throughout. tests/test_ivs_track.c 10/10 under ASan+UBSan (standalone: raptor-common/raptor-ipc not checked out for the full suite). rvd v4 232,472 bytes, v3 241,052. 2026-11-25 12:13: rmd cbddbda (notify_classes / record_classes, two state machines, rmd_events.c + 11 tests) bind-mounted on the v4 (owner allowed), lists unset = as before; rmd 13,828 -> 17,888 bytes. clang-format 19 on changed lines (e8162af). Full raptor suite (root, ~/raptor-test, 0147e22): unit 432/432 incl. ivs_track 10/10 + rmd_events 11/11, integration/ric/rac/rcd/leak-race pass; fuzz, net fallback and rmr front+rear fail identically on the unmodified base e3b1628 (container environment / pre-existing). 0147e22 adds the new sources to build-asan.sh. 2026-11-25 13:35: 3dec2d5 dormant tracks (5 min, same place = IoU >= 70 % revives still): the v4 car at 40-44 % vs 40 % flickered out > 10 s, came back new and re-fired the HomeKit Vehicle + main sensors every ~2 min (track id reached 70); unit 437/437 (ivs_track 15); rvd v4 236,568 B, bind-mounted on the v4; 13:35:46-13:39:37 soak: the car kept track 1 through its dropouts, still, motion off; HomeKit Vehicle fired once (the restart) instead of every ~2 min. 2026-11-26 [motion] track_confirm (61dfad1): on the v4 with the class-sensor rhkd, small distant vehicle boxes at 25-30 % flickered in as new tracks and fired HomeKit Vehicle + Motion 7 times in 7 minutes with nothing moving nearby. Now a new track counts after 3 looks in a row and a still one moves after 2; replay of 4 min of the v4's detections 20 events -> 4 (-> 1, the start-up, with vehicle at 35 %). Live on the v4 from 13:27 (rvd 488028c5 bind-mounted, class_thresholds 40,30,30,35): 15 minutes, only the start-up event, both parked cars still. Unit 21/21 tracker tests (ASan+UBSan)."
notes = "Branch rvd-detect-classes on integration/2026-11-25c; in the images flashed 2026-11-26 (v4 20261125-2114, v3 20261125-2115). Undo on the v4: xb restore v4 rvd (or reboot) and remove `classes` from [motion] (backup /root/raptor.conf.before-classes). Upstream later (gtxaspec/raptor), with the PR resource stats. 2026-11-25 (pipeline sync, research-54): cherry-picked into raptor integration/2026-11-25d (fd76cb7 = upstream main 555ce50 + our branches), the standard build since images 20261125-2114 (v4) / 2115 (v3); conflicts only in rvd/Makefile, tests/Makefile, build-asan.sh (upstream's new rvd_frame_result.c kept beside rvd_ivs_track.c / rmd_events.c). ASan suite = upstream main's (only the known host-only failures). 2026-11-26: carried unchanged into integration/2026-11-26 (upstream main b4c4238); a must-have on both cameras."
