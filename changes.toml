# Features

[[items]]
id = "FEAT-rhkd"
kind = "feature"
title = "rhkd: the HomeKit camera daemon"
why = "HomeKitADK-based daemon reading raptor's rings: live view (two RTP sessions), Opus audio, talkback with echo cancellation, motion sensor, HKSV over HomeKit Data Stream."
status = "local"
part_of = ["GOAL-homekit"]
devices = ["wyze-cam-v3", "wyze-cam-v4"]
tested = "2026-11-20, Wyze Cam v3 and v4: 0.9.7 from the flashed 2026-11-19 images; live view with audio on both. 2026-11-22, Wyze Cam v4 image 20261122-2250 and v3 image 20261122-2251: rhkd 0.9.10 built into the image"
notes = "Public v0.9.10 released 2026-11-20 (public main 21930ef; drops faac 2.x). 2026-11-22: public 9345ccf makes the repo's web UI manifest match the package copy (themactep's patch 0004 from the #2085 review); no release for it. Both cameras run 0.9.10 from their 2026-11-22 images. Ships in upstream Thingino through the thingino-rhkd package (#2085, merged 2026-11-22); the daemon itself is developed here, so it stays local."
[[items.repos]]
repo = "thingino-homekit"
