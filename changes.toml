# ---------------------------------------------------------------------------------------------------
# Fixes

[[items]]
id = "FIX-t41-isp-flip"
kind = "fix"
title = "raptor-hal: flip in the ISP only, on every isp_mode channel (T32/T41)"
why = "On the T41 the flip has to be set in the ISP for every channel; without it set-hflip/set-vflip fail (-4090) and the picture can't be flipped."
status = "in-pr"
waiting_on = "Review of raptor-hal #18."
then = "Bump `THINGINO_RAPTOR_HAL_VERSION` in thingino-firmware."
part_of = ["GOAL-v4-firmware"]
devices = ["wyze-cam-v4"]
prs = ["https://github.com/gtxaspec/raptor-hal/pull/18"]
tested = "2026-11-19, Wyze Cam v4: set-hflip/set-vflip ok, get-isp 1/1"
notes = "2026-11-19 regression: an rvd linked against a raptor-hal branch without this fix shipped to the v4 and lost the flip. Now a must-have for every v4 build."
[[items.repos]]
repo = "raptor-hal"
binaries = ["rvd"]
branch = "v4-fixes"
commits = ["5058901", "30b0b56"]
markers = [{ file = "src/hal_isp.c", text = "hal_isp_hvflip_attr_fill" }]

[[items]]
id = "FIX-rvd-flip-after-start"
kind = "fix"
title = "rvd: apply the configured flip again once the channels run (T41)"
why = "On the T41 the flip set during ISP setup, before any channel is enabled, is ignored: the camera came up unflipped after every rvd start or restart although raptor.conf asked for a flip."
status = "in-pr"
waiting_on = "Review of gtxaspec/raptor #93 (standalone, raised 2026-11-20). Takes effect on the T41 only with raptor-hal #18."
then = "Bump `THINGINO_RAPTOR_VERSION` past it; v4 images can then use upstream raptor for the flip."
prs = ["https://github.com/gtxaspec/raptor/pull/93"]
part_of = ["GOAL-v4-firmware"]
depends = ["FIX-t41-isp-flip"]
devices = ["wyze-cam-v4"]
tested = "2026-11-20, Wyze Cam v4: in the flashed image, flipped right after start (log: flip applied after stream start); PR branch on upstream main 101fb35 with raptor-hal v4-fixes: get-isp 1/1 at start and after `raptorctl rvd restart`, upstream main 0/0 both times; ASan test-all identical to main (146/1/3)"
notes = "Also explains the older note that `raptorctl rvd restart` loses the flip while a reboot kept it."
[[items.repos]]
repo = "raptor"
binaries = ["rvd"]
branch = "fix-t41-flip-after-start"
commits = ["10b59a6", "54c4c3b"]
markers = [{ file = "rvd/rvd_frame_loop.c", text = "rvd_apply_flip(st)" }]

