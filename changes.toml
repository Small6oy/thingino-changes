[[items]]
id = "FEAT-onna"
kind = "feature"
title = "onna: open runtime for the T41 NNA (venus-compatible, no nmem, no soc-nna)"
part_of = ["GOAL-local-ai"]
why = "An open replacement for Ingenic's venus on the T41 NNA. It runs the same venus .bin models with the same output bit for bit, as a 142 KB static binary, without venus's 4.5-11.2 MB libraries, its 20 MiB nmem carve-out, the 128K-L2 U-Boot/module change or /dev/soc-nna: the CPU feeds the NN unit directly. It's the path to NNA detection in upstream images without vendor blobs or boot-time memory reservations."
status = "active"
devices = ["wyze-cam-v4"]
tested = "2026-11-24, QEMU 0.7.26 + gtxaspec ingenic-txx 05d871d66a model (host oracle): yolov5n heads byte-identical to venus on two frames, all 60 convs equal the CPU conv. 2026-11-24, Wyze Cam v4, stock (no nmem, 256K L2, daemons running): heads equal to venus's silicon output on both frames; 412 ms min / 433 avg per frame (speed round 3), 15.1 MB peak RSS. Same boot as venus (nmem 20M + 128K L2): onna 913 ms avg, venus 0.1.2-5 78.8 ms, venus 0.3.7-1 79.8 ms (output identical to 0.1.2-5; its first silicon run). 2026-11-24, v4 stock, speed rounds 4-5: 145 ms min / 163 avg, 15.2 MB peak RSS, heads equal to venus on both frames; SiLU requant and heads in MXU3 (vrqtest: 369M silicon cases, 0 mismatches). Round 6: 96-100 ms min / 113 avg, same output (F straight from the tensor; add, concat rescale and maxpool in MXU3, vaddtest every input 0 mismatches)."
notes = "Source: Small6oy/thingino-ai tools/onna (C99: nnacpu.c CPU ops, nnabin.c validating .bin + graph loader, nnaeng.c NNA conv driver with its own tiling, be_mxu3.c the NN instructions as .word, oracle/ the host test harness built from QEMU's ingenic-nna.c at build time); notes docs/nna-runtime.md; merged PRs #13, #14, #16. Licence not chosen yet (ojzdl: MIT, Thingino Project). The NN unit runs with no driver setup; the T41's F RAM is sliced (2-bit slices 0x37/4 lines apart). Remaining time is CPU (requant ~430 ms, F packing ~250 ms per frame); the NN instructions cost nanoseconds. Next: speed round 3 (requant on MXU3, F once per band, no per-instruction calls), then a raptor-hal backend like FEAT-ojzdl. Research notes: nna/open-runtime.md, nna/c-driver-plan.md."

