# --- gtxaspec/qemu issues we took on 2026-11-22 (Ingenic emulator; no camera build depends on them) ---

[[items]]
id = "ISSUE-qemu-avpu-timer-thread"
kind = "issue"
title = "qemu: encoder completion timer on its own thread, so a busy main loop no longer delays silicon-time's job completions (gtxaspec/qemu #37)"
why = "With ingenic-avpu.silicon-time=on, 4 of 20 runs of the T31X SDK demo still drop to 17-19 fps: the completion timer waits 10-20 ms behind a main loop busy with ISP frame passes. The owner named it the next step before silicon-time can become the default. Second part: count frames in guest time in the timing tests."
status = "in-pr"
prs = ["https://github.com/gtxaspec/qemu/pull/52"]
waiting_on = "The maintainer's re-review of #52: all three review changes pushed on 2026-11-23 (6c9f05fa90, four commits on ingenic-txx 26129bea50) and answered on the PR."
then = "Nothing beyond his cherry-pick; #37 stays open for its second item (silicon-time in the timing tests, frames counted in guest time)."
tested = "2026-11-23, emulator only (thingino T31X GC2053 image, 1080p+360p H.264, silicon-time on), 20+20 interleaved 300 s runs on .5: aborts 10/20 -> 0/20, jobs on time 81% -> 94%, lateness p99 26.6 -> 4.1 ms, max 95.7 -> 26.8 ms; quiet-window fps 24.15-24.46 -> 24.58-24.73; after the review split (2026-11-23): 119 Ingenic qtests, devdoc check and checkpatch clean, unrealize tried with a throwaway start/unrealize/start build"
notes = "Issue: https://github.com/gtxaspec/qemu/issues/37. Pure model change, tested on the emulator. Commits and PR text carry no AI mention (checkpatch). No claim comment on the issue (user, 2026-11-22). PR #52 is Part of #37 (item 1, the thread); item 2 (silicon-time on in the timing tests, frames counted in guest time) stays with the owner's harness. Review 2026-11-22 (gtxaspec): merge after small changes; done and force-pushed 2026-11-23. Small6oy/qemu avpu-due-thread (6c9f05fa90, on ingenic-txx 26129bea50), 4 commits: resume only vCPUs a hold paused + NULL timer_del guard (own commit, upstream silicon-time aborts in mips_cpu_do_interrupt in half our runs); due thread + unrealize (oneshot BH + join) + 3 TCG qtests; ingenic_avpu_done gets the completion's guest time; README paragraph. Frames per second still follow host load (his SDK demo runs and ours). Work tree ~/qemu-avpu37 on .5 (container qemu37-build, harness run/ab.sh + run/an2.py). Body: upstream/qemu/pr52-avpu-due-body.md, reply: upstream/qemu/pr52-reply-review.md."

[[items]]
id = "FIX-qemu-t41-nna-wram"
kind = "fix"
title = "qemu: a T41NQ's NNA W RAM holds 288 entries, not 1024 (gtxaspec/qemu #64)"
why = "ingenic-nna gave the T41 1024 W entries; a T41NQ keeps 288 (72 KiB) and wraps the write pointer to entry 0. NNA code that keeps more than 288 entries loaded passes in the emulator and reads the wrong weights on silicon (FEAT-onna hit it)."
status = "in-pr"
prs = ["https://github.com/gtxaspec/qemu/pull/64"]
waiting_on = "The maintainer's review of #64."
then = "Address the review; after the merge, drop this item."
