[[items]]
id = "FEAT-rhkd-class-sensors"
kind = "feature"
title = "rhkd: one HomeKit motion sensor per detection class; HKSV follows record_classes"
why = "Owner (2026-11-25): one sensor per class. With a yolo model rhkd adds a Motion Sensor per detected class (Person, Pet, Package, Vehicle; names from [motion] class_names, renamable in Home), each on while an object of that class is new or moving (rvd class_mask, same debounce as the main sensor). The existing Motion sensor stays the one HKSV is linked to and now counts only [motion] record_classes (unset = every class, none = never). Without yolo nothing changes."
status = "local"
part_of = ["GOAL-local-ai", "GOAL-homekit"]
devices = ["wyze-cam-v3", "wyze-cam-v4"]
tested = "2026-11-25: builds clean for xburst1 (849,376 B) and xburst2 (860,076 B, static docker build); classes.c host test with ASan+UBSan. 2026-11-25 13:26 on the v4 (owner OK): bind-mounted /tmp/xb/rhkd (md5 ef8fbb8c, docker static build) over the image rhkd 0.9.10, restarted by S98rhkd supervise; logged \"4 class sensor(s): Person, Pet, Package, Vehicle\", DB revision 12.7cc1 bumped the CN, the Home hub read the new sensors (0x401..0x431) within 2 s; quiet scene: no class fired, no errors, VmRSS 2.9 MB. A real walk-past not yet seen. Undo: umount /usr/bin/rhkd + killall rhkd (supervisor restarts the image rhkd), or reboot."
notes = "Needs raptor rvd-detect-classes (class_mask). Up to 8 class sensors, kAttributeCount 65 -> 105; DB revision = 12 << 16 | class-set fingerprint, so a classes change in raptor.conf bumps the CN. Branch class-sensors in the homekit repo (share checkout stays on main). Next: v4 test (owner OK), PR resource stats (tools/rhkd-stats.sh), then public thingino-homekit release + version-bump PR."
[[items.repos]]
repo = "thingino-homekit"
branch = "class-sensors"
commits = ["f13357f"]
binaries = ["rhkd"]

[[items]]
id = "FEAT-hal-v4-fixes-ai"
kind = "feature"
title = "raptor-hal v4-fixes-ai-N: the HAL branch the cameras' detection builds use (now v4-fixes-ai-7)"
why = "One HAL tree that carries the v4's must-have HAL fixes (on upstream main, plus the Gen3 gain scale) together with the open runtimes' backends (ojzdl, onna) and the shared YOLO decode, so a camera build takes detection and the camera fixes from the same place. Each update of the onna or ojzdl backends is merged into a new ai-N branch, so a camera's tree can be named exactly."
status = "local"
part_of = ["GOAL-local-ai"]
devices = ["wyze-cam-v3", "wyze-cam-v4"]
tested = "2026-11-25 13:49, v4: rvd 00c5a52 linked with v4-fixes-ai-4, YOLO-N T41 from the model library with only model.conf: 3 heads at strides 8/16/32, model keys from the sidecar. 2026-11-26: images v4 20261125-2114 and v3 20261125-2115 (both HAL v4-fixes-ai-5, c022081) flashed, detection runs from the image with no bind mounts. 2026-11-26 06:05, v4: rvd linked with v4-fixes-ai-6 (6cc9dac, onna memory pool): RSS 21.9 to 13.4 MB, MemAvailable 11.9 to 19.8 MB, yoloxn 87 ms; 30-minute soak running."
notes = "ai-4 (24fcd54): ai-3 + onna-backend 9f27073 (graph from the .bin, anchors from the caller). ai-5 (c022081): ai-4 + onna W cache past 256 records (thingino-ai #76), resize on MXU3 (#71/#73), the preprocess check from #26; the standard image build since 2026-11-25 evening. ai-6: onna-backend eae6739 (thingino-ai #77 tensor pool, #78 SiLU fix; 6cc9dac) + ojzdl-backend 0fa78eb (thingino-ai #79 weights held once; 4585a43); standard since 2026-11-26 06:45 after a clean 32-minute v4 soak. ai-7 (fdf2d33, 2026-11-26): the same changes recut on upstream main 97eb7ee (IVDC direct-mode report, JPEG IVDC channel) together with the Gen3 gain fix; tree = ai-6 plus exactly upstream's new commits; builds clean for v3 and v4. Now the standard HAL."
[[items.repos]]
repo = "raptor-hal"
branch = "v4-fixes-ai-7"
commits = ["24fcd54", "c022081", "6cc9dac", "4585a43", "fdf2d33"]

[[items]]
id = "FIX-rvd-save-raw-ivs"
kind = "fix"
title = "rvd: save raw on the JZDL channel takes its frame from the JZDL thread"
why = "With detection on, `raptorctl rvd save raw <file> 1` crashed rvd (SIGSEGV in libimp list_del_FSDepth / list_add): save raw's transient SetFrameDepth(1)/GetFrame/SetFrameDepth(0) raced the JZDL thread's depth-1 GetFrame loop on the same framesource channel and tore its queue down."
status = "pr"
part_of = ["GOAL-local-ai"]
devices = ["wyze-cam-v3", "wyze-cam-v4"]
prs = ["https://github.com/gtxaspec/raptor/pull/108"]
tested = "2026-11-26 13:44, Wyze Cam v4 (rvd 8a20824b = integration/2026-11-26 61dfad1 + fix): 20x save raw 1 + save jpeg 1 and 5x save raw 0, all ok, same rvd pid, no SIGSEGV; channel-1 NV12 a clean frame. Before: 6 rvd deaths in ~30 rounds."
notes = "Both halves are upstream raptor code (JZDL thread b003aa4/475e618, save raw 9f933f0); it hits anyone with IVS_DETECT + JZDL who saves raw on the sub stream. Carried in integration/2026-11-26 5422458 (research-12)."
[[items.repos]]
repo = "raptor"
binaries = ["rvd"]
branch = "rvd-save-raw-ivs"
commits = ["1a8fa25"]
markers = [{ file = "rvd/rvd_ivs.c", text = "rvd_ivs_grab_raw" }]
