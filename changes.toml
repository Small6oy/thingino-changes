[[items]]
id = "ISSUE-qemu-t41-f-noprogram"
kind = "issue"
title = "qemu: T41 NNA F writes with no WFCW program (0x5a = 0) differ from silicon (gtxaspec/qemu #63)"
why = "ingenic-nna treats 0x5a = 0 as one F line per 4-pixel slot (the same as the one-word program 0x801); a T41NQ writes F elsewhere. Code that relies on the default passes in the emulator and gives wrong sums on hardware."
status = "unfixed"
devices = ["wyze-cam-v4"]
tested = "2026-11-24, Wyze Cam v4 vs ingenic-txx 05d871d66a, fprobe (identity weights, address-coded F): with the program both agree, without it they differ; NNCMD 0x60 is a no-op on both"
notes = "Issue: https://github.com/gtxaspec/qemu/issues/63 (no patch: silicon's rule for 0x5a = 0 is unknown). onna always programs WFCW, so it is not affected. Same session confirmed upstream's ae58bace25 (T41 F RAM slices) against silicon address for address. Body: upstream/qemu/issue-t41-f-noprogram-body.md."

[[items]]
id = "ISSUE-qemu-tcu-silicon"
kind = "issue"
title = "qemu: TCU prescaler divisors, TCSR bit 23 and TSR reset measured on a T31X and a T41NQ (gtxaspec/qemu #47)"
why = "The TCU model's prescaler divisors (/1 to /1024) are unconfirmed on every part, the T41's TCSR bit 23 is writable but its effect over a full count is unmeasured, and TSR's reset value has to be read before the kernel touches it. Our Wyze Cam v3 (T31X) and v4 (T41NQ) can measure them."
status = "in-pr"
prs = ["https://github.com/gtxaspec/qemu/pull/50"]
waiting_on = "The maintainer's merge of #50 into ingenic-txx (after his combined regression gate and CI), released in ingenic-0.7.30. Re-review 2026-11-23 06:26 UTC: MERGE (https://github.com/gtxaspec/qemu/pull/50#issuecomment-7093337867)."
then = "Address anything the re-review raises; after the merge, set status merged. The bench items he left open (not blocking) stay open; we can only measure a T31X and a T41NQ."
devices = ["wyze-cam-v3", "wyze-cam-v4"]
tested = "2026-11-22, Wyze Cam v3 (T31X) and v4 (T41NQ), TCU ch2 and ch3 via emu/tools/tcu47/tcuprobe.c; registers restored, no reboot"
notes = "Issue: https://github.com/gtxaspec/qemu/issues/47. Measured 2026-11-22 (logs emu/tools/tcu47/logs): prescaler codes 0-5 exact /1../1024, codes 6 and 7 /2 on both parts (model /1024); T41 bit 23 turns off the wrap at TDFR, count stands at 0xffff; a count above TDFR runs to 0xffff and rolls to 0 with no flag (both); T41 bits 11/14/16 gating (reported only). TSR reset NOT measured: no UART on either camera (user, 2026-11-22). Model branch tcu-silicon-47 in ~/qemu-tcu47 on .5 (commit 029b63ed34, qtests prescale/above/hold pass and fail on the old model, all 32 tcu + 11 migrate pass, checkpatch clean). Comment posted 2026-11-22 (https://github.com/gtxaspec/qemu/issues/47#issuecomment-7078086366), PR #50 opened from Small6oy/qemu tcu-silicon-47. Drafts in upstream/qemu/issue47-tcu-silicon-body.md. Reviews: 2026-11-22 12:12 (MERGE AFTER CHANGES, three changes), our reply 13:08, gating change landed 16:20, verdict repeated 17:14 with his own conflict resolution (https://github.com/gtxaspec/qemu/pull/50#issuecomment-7082691948). Bench questions he leaves open (not blocking): codes 6/7 on T32LQ, A1, T40XP; bit 23 on T32LQ and A1; PWM and interrupt rate while held; T41LQ/XQ. 2026-11-23: rebased onto ingenic-txx 26129bea50 (gating change aad9735ee8) as 25ea1598e8: change 1 his way (bit 23 kept in the 32-bit TCSR, chn-hold in the T41 block, tcu_chn_hold(), bit 23 in tcu_chn_clock_bits(), no channel field, channel vmstate stays version 3) plus a T32LQ case (bit stored, no hold); changes 2 and 3 from 9ebc49211f. tcu 34/34, migrate 11/11, all 119 Ingenic qtest binaries (1825 cases) pass; prescale/above/hold fail on the base model; checkpatch clean. Force-pushed (owner OK) and replied: https://github.com/gtxaspec/qemu/pull/50#issuecomment-7086427212."

[[items]]
id = "ISSUE-qemu-sensor-bayer"
kind = "issue"
title = "qemu: the image-sensor model's own Bayer pattern, so the raw frame no longer follows ISP 0x80018 (gtxaspec/qemu #25)"
why = "On silicon the raw frame's Bayer order comes from the sensor and ignores the ISP's 0x80018; the model derives it from 0x80018, so a guest that sets that register differently changes the raw dump. Last item of the raw dump / raw input issue."
status = "in-pr"
