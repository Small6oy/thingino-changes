devices = ["wyze-cam-v3", "wyze-cam-v4"]
prs = ["https://github.com/gtxaspec/raptor-hal/pull/26"]
tested = "2026-11-24, host build vs a Python reference decode on libjzdl outputs of a 2-head persondet-derived model (8 frames) and the magik yolov5 sample (4 frames): same boxes, classes and scores, 12/12. 2026-11-24, Wyze Cam v3 live in rvd: person detected on a walk-past at 0.45-0.50, +7.7 % CPU. 2026-11-25, flashed on both cameras (v3 image 20261125-0917, v4 image 20261125-0924): labelled detections from the v2 model on both."
notes = "raptor-hal: hal_ivs_yolo.c used by the ojzdl and libjzdl backends (onna decodes on its own and reads the same class_threshold and anchors fields). raptor: rvd-detect, on top of #96 (its own interval sleep dropped: #96 releases the frames between inferences). raptor-hal side: draft PR #26 (merge order #22, #26, #25; adds a preprocess field, stretch or letterbox). raptor side (rvd-detect) not raised yet."
