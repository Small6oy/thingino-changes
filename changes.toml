[[items]]
id = "FEAT-ojzdl"
kind = "feature"
title = "ojzdl: open JZDL runtime in raptor-hal (no libjzdl, no libstdc++)"
part_of = ["GOAL-local-ai"]
why = "An open replacement for Ingenic's libjzdl.m.so, built into raptor-hal: the same JZDL models (the magik yolov5 and persondet samples, our own models) give the same detections bit for bit at the same speed on the T31, without libjzdl.m.so (609 KB) or libstdc++ (2.2 MB); rvd grows about 33 KB. Converter, models and runtime are then all open, and we can add operations libjzdl lacks."
status = "in-pr"
waiting_on = "Review and merge of raptor-hal #22 (OJZDL=1 backend) and raptor #104 (JZDL_LIBS). thingino-firmware #2221 (engine choice in menuconfig) is a draft until both are in."
then = "Rebase #2221, bump THINGINO_RAPTOR_HAL_VERSION and THINGINO_RAPTOR_VERSION to the merged commits, build a v3 image with the ojzdl engine, mark it ready."
devices = ["wyze-cam-v3"]
prs = ["https://github.com/gtxaspec/raptor-hal/pull/22", "https://github.com/gtxaspec/raptor/pull/104", "https://github.com/themactep/thingino-firmware/pull/2221"]
tested = "2026-11-24, QEMU (XBurstR2): persondet, our person/pet/package model and yolov5 bit-identical to libjzdl on 6 frames each (54/54). 2026-11-24, Wyze Cam v3: all three models bit-identical; persondet forward 84-92 ms vs libjzdl 89-96 ms; hal_jzdl_detect gives the same detections as the libjzdl backend on real NV12 frames (every box and confidence bit), 247 vs 244 ms; live in rvd (IVS_DETECT=1 JZDL_LIBS=, [motion] algorithm = yolo): model loaded, main and sub video at 20 and 15 fps, RSS flat, no errors. Temporary bind mount, reverted. 2026-11-25, Wyze Cam v3, flashed image 20261125-0917 (ojzdl + shared YOLO decode FEAT-yolo-decode): thingino-ai-models person/pet/package/vehicle v2 loads (4 classes, 2 heads, 17557 outputs), live labelled detection (vehicle 0.49), rvd 9 % CPU at one inference per second, RSS 11.5 MB. 2026-11-25, Wyze Cam v3: raptor-hal #25 head with yoloxn in rvd for 32 min, clean (rvd 20-21 %, RSS 11.7 MB flat). 2026-11-26: thingino-ai #79 holds the weights once and drops the model buffer (yoloxn heap 4.23 to 2.63 MiB, bit-exact); in raptor-hal #22 (0fa78eb) and HAL v4-fixes-ai-6, not on the v3 yet."
notes = "Source of truth: Small6oy/thingino-ai tools/ojzdl (licence MIT, Thingino Project, as raptor-hal's sources); vendored in raptor-hal src/ojzdl. MXU2 kernels on the T31, plain C on other SoCs. A v3 must-have since 2026-11-25: the v3 image runs detection on ojzdl with the person/pet/package/vehicle v2 model (image 20261125-0917, flashed). Findings for upstream's detection path: the stock yolov5 sample scores about 0.06 at most on person frames (likely its transposed 320x416 input), and the libjzdl backend segfaults on non-yolov5 models (ojzdl rejects them)."
