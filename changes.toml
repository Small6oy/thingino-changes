notes = "NN_WRAM_T41 256 KiB -> 72 KiB (nn_wcap's modulo then wraps at 288), qtest engine/w-wrap, program record limit 512 -> 1280. Body: upstream/qemu/pr-t41-nna-wram-body.md."
[[items.repos]]
repo = "qemu"
