[[items]]
id = "ISSUE-v3-snapshot-503"
kind = "issue"
title = "Wyze Cam v3: the substream snapshot (/x/ch1.jpg) fails with 503 after about 3 s"
why = "Seen while measuring the web UI on 2026-11-20: three requests in a row each took 2.8-3.0 s and returned 503 on the v3, while the v4 returned its ch1 snapshot in 0.8-1.2 s. Pages and HomeKit snapshots that use it get no picture."
status = "unfixed"
devices = ["wyze-cam-v3"]
part_of = ["GOAL-webui-speed"]
notes = "Not investigated yet. On the v4 the 2026-11-17 cause of failing snapshots was rvd's 64 KB jpeg1 ring overflowing at quality 75 (fixed there with quality 30); check whether the v3's stream1 JPEG has the same problem first."

[[items]]
id = "FEAT-motion-light"
kind = "feature"
title = "thingino-motion-light: white light on motion at night"
why = "The Wyze Cam v4's spotlight should switch on for motion after dark. Until now a script in the camera's overlay did it, surviving flashes only through the settings backup. The package polls RMD (motion) and RIC (night) and uses `light white on|off`, so it works on any camera with gpio.white and needs no hard-coded pin."
status = "local"
devices = ["wyze-cam-v4"]
tested = "2026-11-20, Wyze Cam v4: script with forced night switched the spotlight on at motion through `light white`, off on stop; shellcheck clean; package builds and installs in the v4 dev tree"
notes = "Build with -b \"... motion-light\" -K \"BR2_PACKAGE_THINGINO_MOTION_LIGHT=y\". Before flashing the first image that has it, take /usr/sbin/motion-light and /etc/init.d/S33motion-light out of the v4's /etc/cfg-backup.list (the restore would bring back the old daemon next to S96motion-light). GPIO 47 (dim channel) stays low via /etc/gpio.conf. Upstream PR candidate."
[[items.repos]]
repo = "thingino-firmware"
branch = "motion-light"
commits = ["9d2e9289d"]

[[items]]
id = "FIX-rhkd-config-save-bitrate"
kind = "fix"
title = "rhkd: a config save during a live view no longer keeps the temporary bitrate"
why = "rvd's set-bitrate also updates its in-memory config, so saving the running config (e.g. from the web UI) while HomeKit has lowered a stream's bitrate for a live view stored that temporary bitrate in raptor.conf, and it survived the next restart. rhkd now remembers the temporary values it set and, after restoring the encoder (or at startup after a crash), puts the configured value back in raptor.conf if the file holds one of them. Values the owner chose are left alone."
status = "in-pr"
waiting_on = "Review of thingino-firmware #2085 (pins rhkd v0.9.8)."
prs = ["https://github.com/themactep/thingino-firmware/pull/2085"]
part_of = ["GOAL-homekit"]
devices = ["wyze-cam-v3", "wyze-cam-v4"]
tested = "2026-11-20, Wyze Cam v3 (test instance): config save mid-session left [stream2] bitrate = 299000; repaired to 1500000 at session end, and at startup after a kill -9"
notes = "Seen 2026-11-17 (stream1 300000) and 2026-11-19 (aux 299000). rhkd 0.9.8: public release v0.9.8 (63be501), running on both cameras (overlay). The cleaner fix would be a non-persisting set-bitrate in rvd; not raised."
[[items.repos]]
repo = "thingino-homekit"
branch = "main"
commits = ["f27d5a8"]
markers = [{ file = "src/rhkd/bitrate.c", text = "had the live view's temporary bitrate" }]
