[[items]]
id = "FEAT-rvd-aux-stream"
kind = "feature"
title = "rvd: on-demand aux stream for HomeKit"
why = "A third H.264 encoder ([stream2], ring \"aux\") that only runs while something reads it, so HomeKit live view gets a matching size without retuning main or sub (which recordings and NVRs use). Keeps encoding a few seconds after the last reader so a quick reconnect doesn't restart it."
status = "parked"
waiting_on = "Owner decision (2026-11-20): the aux stream's architecture is still open (on-demand third encoder vs. alternatives, framesource 2 while idle, per-session size)."
then = "Settle the design, rebase onto upstream main, run test-all and raise it separately from #88. The T41 flip part went up alone as raptor #93."
part_of = ["GOAL-homekit"]
devices = ["wyze-cam-v3", "wyze-cam-v4"]
tested = "2026-11-19, Wyze Cam v3 (1280x720) and v4 (1920x1080): live view, resize during a session, linger; 2026-11-20: built into the flashed images (v3 aux 1280x720, v4 aux 1920x1080)"
notes = "Images built 2026-11-19 take raptor from branch integration/2026-11-19 (cf1e71a): this feature + FIX-rvd-flip-after-start + FIX-ringdump-reopen-stale + FEAT-rad-extra-outputs + FEAT-faac3 + Thingino's digital-zoom package patch (overrides skip package patches)."
