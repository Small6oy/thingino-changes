notes = "2026-11-19 regression: an rvd linked against a raptor-hal branch without this fix shipped to the v4 and lost the flip. 2026-11-22: raptor-hal #18 closed in favour of #16 (sensor-side flip). Its premise was wrong: the OS04D10 T41 driver does have a sensor flip (os04d10_set_hvflip, inlined into the ioctl handler). #18 alone also left the configured flip unapplied at start. Reverted on v4-fixes; the PR branch is kept in case sensors without a driver flip (9 of 108 T41 drivers) ever need an ISP fallback."
