# ---------------------------------------------------------------------------------------------------
# Goals

[[items]]
id = "GOAL-homekit"
kind = "goal"
title = "Native Apple HomeKit on Thingino cameras"
why = "Cameras appear in Apple Home on their own, without a bridge: live view, two-way audio, motion, HomeKit Secure Video recording."
status = "active"
devices = ["wyze-cam-v3", "wyze-cam-v4"]
notes = "Upstream since 2026-11-22: thingino-firmware #2085 merged (b56778145), adding the thingino-rhkd package pinned to rhkd v0.9.10. Future rhkd releases go up as version-bump PRs to package/thingino-rhkd. Open: the maintainers may want rhkd under their own GitHub organisation; if so, transfer or fork the repo and update THINGINO_RHKD_SITE."

[[items]]
id = "GOAL-webui-speed"
kind = "goal"
title = "A faster, leaner Thingino web UI"
why = "Page loads were slow on the cameras: uncached assets, repeated agent round trips, a heartbeat per tab."
status = "active"

[[items]]
id = "GOAL-local-ai"
kind = "goal"
title = "On-camera AI object detection"
why = "Cameras detect person, pet and package (video) and sound events (baby crying, dog barking, alarm) locally and turn each into HomeKit events, OSD boxes and MQTT, with a web UI to switch classes on or off. No cloud. Person detection has a commercial precedent on the same silicon (the Aqara G100, a T31, runs a person-only detector on-camera); pet, package and sound are ours to prove. We benchmark against it."
status = "active"
devices = ["wyze-cam-v3", "wyze-cam-v4"]
notes = "Running on both cameras since the 2026-11-25 images: the v3 (T31) on our open JZDL runtime FEAT-ojzdl (CPU, MXU2), the v4 (T41) on our open NNA runtime FEAT-onna (no nmem, no vendor libraries, venus speed). Default model since 2026-11-25: our open YOLOX-Nano 4-class v1 (Apache-2.0, person/pet/package/vehicle), public in the thingino-ai releases. Per-class Detect, tracking gate and Notify/Record (FEAT-rvd-detect-classes), one HomeKit sensor per class (FEAT-rhkd-class-sensors, not in an image yet) and the web UI overlay and settings page (FEAT-webui-detect-overlay) sit on top. Fallback on the T41: venus 0.3.7-1 (in ingenic-lib, needs nmem; the 128K L2 is upstream since 2026-11-25). Same ivs-status -> rmd -> rhkd/OSD/webui pipeline above either backend. Design rules from the G100: a per-object tracking gate before any report, and detect/notify/record as three independent per-class decisions. Sound detection (an audio classifier on the mic path) is a parallel track. All work lives in a dedicated repo, thingino-ai (a private repo plus a public mirror); the thingino integration code stays on the upstream forks and is mirrored there. Task breakdown and gates: research ai/tasks.md; benchmark method: ai/benchmark.md. v3 first."

[[items]]
id = "GOAL-v4-firmware"
kind = "goal"
title = "Our own firmware image for the Wyze Cam v4"
why = "Build and flash the v4 from our firmware fork with HomeKit and the camera's fixes included, instead of overlay-only changes."
status = "active"
devices = ["wyze-cam-v4"]

[[items]]
id = "GOAL-aac-update"
kind = "goal"
title = "Update the AAC audio codecs: libfaac 3.0 and FAAD3"
why = "Move the cameras' AAC encoding to faac 3.0 and replace the Helix AAC decoder with the FAAD3 bundled with it, across raptor, the HomeKit daemon and the firmware, for a newer codec and less flash."
status = "active"
devices = ["wyze-cam-v3", "wyze-cam-v4"]
notes = "AAC-ELD question (2026-11-19): faac 3.0 and FAAD3 don't do AAC-ELD (deliberately); the only ELD encoder is fdk-aac, whose licence doesn't fit GPL code, so HomeKit live view and talk stay Opus and recordings use AAC-LC, as the certified Aqara G100 does for recordings. Test on the Wyze Cam v4: when recordings offered AAC-ELD first, the home hub selected it (audio codec 1); back on AAC-LC only it re-selected AAC-LC within seconds. Whether a hub plays ELD recordings is untested (needs an ELD encoder)."

[[items]]
id = "GOAL-t41-nna"
kind = "goal"
title = "Object detection on the T41 NNA"
why = "Run small detection models (yolov5n) on the T41's neural accelerator."
status = "active"
devices = ["wyze-cam-v4"]
notes = "Works on the v4 (~80 ms per frame on CPU0). The maintainer's U-Boot fix landed in thingino-firmware master on 2026-11-25 (3d25f90ba: the SPL sets the L2 to 128 KiB on T40 and T41, so the ORAM sits where soc-nna maps it; our draft #2232 closed as superseded). Our images from 2026-11-25 are built on a master that has it; reading MSCR on the v4 (0x02000430 expected) is still to do. Detection itself no longer needs it: our own runtime FEAT-onna drives the NNA without nmem, soc-nna or the L2 change. 2026-11-26: the Wyze Cam v4 on a stock image built on that master reads MSCR 0x02000430, so the 128 KiB L2 is live on silicon."

[[items]]
id = "GOAL-ric-sensor-data"
kind = "goal"
title = "Sensor data page that charts what ric decides day and night on"
why = "On raptor cameras the web UI's Sensor data page was built for daynightd and shows errors and no thresholds. Day/night is decided by ric (scene luma, total gain, a learned night baseline), so the page should chart those signals against ric's own thresholds."
status = "active"
devices = ["wyze-cam-v3", "wyze-cam-v4"]
notes = "Ran on the Wyze Cam v4 from 2026-11-20 13:00 (test ric + raptorctl bind-mounted, page files in the overlay); the images flashed since then don't carry the test ric. Paused. Next: the v3, then the raptor PR, then the thingino PR with the raptor pin bump."

