[[items]]
id = "FEAT-onna"
kind = "feature"
title = "onna: open runtime for the T41 NNA (venus-compatible, no nmem, no soc-nna)"
part_of = ["GOAL-local-ai"]
why = "An open replacement for Ingenic's venus on the T41 NNA. It runs the same venus .bin models with the same output bit for bit, as a 142 KB static binary, without venus's 4.5-11.2 MB libraries, its 20 MiB nmem carve-out, the 128K-L2 U-Boot/module change or /dev/soc-nna: the CPU feeds the NN unit directly. It's the path to NNA detection in upstream images without vendor blobs or boot-time memory reservations."
status = "active"
devices = ["wyze-cam-v4"]
prs = ["https://github.com/gtxaspec/raptor-hal/pull/25"]
tested = "2026-11-24, QEMU 0.7.26 + gtxaspec ingenic-txx 05d871d66a model (host oracle): yolov5n heads byte-identical to venus on two frames, all 60 convs equal the CPU conv. 2026-11-24, Wyze Cam v4, stock (no nmem, 256K L2, daemons running): heads equal to venus's silicon output on both frames; 412 ms min / 433 avg per frame (speed round 3), 15.1 MB peak RSS. Same boot as venus (nmem 20M + 128K L2): onna 913 ms avg, venus 0.1.2-5 78.8 ms, venus 0.3.7-1 79.8 ms (output identical to 0.1.2-5; its first silicon run). 2026-11-24, v4 stock, speed rounds 4-5: 145 ms min / 163 avg, 15.2 MB peak RSS, heads equal to venus on both frames; SiLU requant and heads in MXU3 (vrqtest: 369M silicon cases, 0 mismatches). Round 6: 96-100 ms min / 113 avg, same output (F straight from the tensor; add, concat rescale and maxpool in MXU3, vaddtest every input 0 mismatches). Round 7: 85 ms min / 101 avg (16-channel tensors as 32-byte pixels), same output. Round 8: 78-80 ms min / 94 avg with rhkd and rvd running (F windows, shorter requant, per-pair border path), same output. Round 9, same venus boot, interleaved: onna 82.9-83.0 ms avg / 69.6-69.9 best vs venus 0.3.7-1 81.6-82.0 / 68.5-69.1 and 0.1.2-5 84.7-86.0 / 68.9-70.1: venus's speed, same output, no nmem. 2026-11-24, second model (onnaq, the QSUM kind: NNA requantizes, depthwise, per-channel 1x1, ConvTranspose): the thingino-ai 416x320 detector on the stock v4, heads byte-identical to venus's silicon output (= Ingenic PC executor) on 2 frames, every conv checked against the CPU on silicon; 44.6 ms best / 54 avg (venus 0.1.2-5: 28.7 / 37 with nmem + 128K L2). Speed round 2 the same evening: 23.1 ms best / 33-35 avg on the stock v4, faster than venus, same output (PR #34). QEMU's mismatch on this model = register 0x5b (gtxaspec/qemu#65). 2026-11-25: the v4 resets under sustained NN work were a T41 dual-core deadlock (CPU0 NN + MXU3 loads/stores vs CPU1's ISP firmware MXU3 code in isp_fw_process); fixed by pinning isp_fw_process to CPU0 (nna_pin_isp_cpu0, PR #35): 50,000 frames with video on, no reset, output correct, no speed cost. The integration (init script / raptor-hal backend) must do the same pin. 2026-11-25: raptor-hal backend (ONNA=1, hal_ivs_onna.c, branch onna-backend; pins isp_fw_process in create): host build = independent NumPy decode box for box, v4 silicon = host (network ~32 ms, resize 21 ms); live in rvd on the v4 (detect_interval_ms 500): both streams 25.0 fps with the frame-copy fix (raptor branch ivs-detect-frames on #96); without it the main stream fell to 15 fps (frame held) or 7 fps (frames unread). 2026-11-25, v2 model (person/pet/package/vehicle, re-exported with the chain clamp because onna has no Add yet): heads byte-identical venus = onna = golden model on the v4; venus 34.5 ms avg / 23.1 best, onna 40.7 / 25.1. Same day, venus 30-minute soak on the v4 (nmem boot, isp_fw_process unpinned): 49,000 inferences, no reset, both streams 25 fps, so the dual-core deadlock is specific to CPU-side MXU3 work like onna's. 2026-11-25 10:37, Wyze Cam v4, flashed image 20261125-0924 (onna, hal v4-fixes-ai-3, raptor integration/2026-11-25c): v2 live in rvd at 500 ms, network 32 ms + resize 22 ms, rvd RSS 14.3 MB, both streams 25.0 fps with no gaps, labelled detections (vehicle 0.46), per-class thresholds from the config. 2026-11-26, Wyze Cam v4: Ingenic's yolov5n venus .bin runs through onnaq (thingino-ai #72, one runner since #74) and, after the 32-channel SiLU fix (#78, a camera-only bug), its output is byte-identical to venus on the v4. Memory (thingino-ai #77: tensor pool, weights dropped after the first frame): YOLOX-Nano standalone RSS 9.0 MB; rvd from HAL v4-fixes-ai-6 RSS 21.9 to 13.4 MB, MemAvailable 11.9 to 19.8 MB, yoloxn 87 ms; soak running. This targets the v4 resets traced to memory reclaim and the OOM killer (2026-11-25/26)."
notes = "Source: Small6oy/thingino-ai tools/onna (C99: nnacpu.c CPU ops, nnabin.c validating .bin + graph loader, nnaeng.c NNA conv driver with its own tiling, be_mxu3.c the NN instructions as .word, oracle/ the host test harness built from QEMU's ingenic-nna.c at build time); notes docs/nna-runtime.md; merged PRs #13, #14, #16 ... #38. Licence: MIT, Copyright Thingino Project, as ojzdl (owner, 2026-11-25; PR #37). On the v4 since 2026-11-25 (image 20261125-0924: firmware branch raptor-ivs-onna, raptor integration/2026-11-25c, hal v4-fixes-ai-3; the backend also honours class_threshold and config anchors). Add support landed 2026-11-25 (thingino-ai #45/#47/#50/#52: Add, YOLO-style graphs, every conv on the NNA). Upstream: raptor-hal #25 (draft, ONNA=1, on #22 and #26), fast-forwarded to the #77/#78 runtime on 2026-11-26. The NN unit runs with no driver setup; the T41's F RAM is sliced (2-bit slices 0x37/4 lines apart). Remaining time is CPU (requant ~430 ms, F packing ~250 ms per frame); the NN instructions cost nanoseconds. Next: speed round 3 (requant on MXU3, F once per band, no per-instruction calls), then a raptor-hal backend like FEAT-ojzdl. Research notes: nna/open-runtime.md, nna/c-driver-plan.md. 2026-11-25 evening: nnaeng.c kept per-record weight pointers in wcache[256] with no bound; yoloxn (324 records) and mnv4n (360) overwrote onnaq's wtrim[] inside rvd, so those layers ran with wrong weights (the standalone runner was unaffected). Fixed in thingino-ai #76 (NNA_MAXREC 1024 + bounds check), raptor-hal #25 dda2c52, v4-fixes-ai-4 fd193a8 / ai-5 c022081. v4 with the fix (rvd 306375c2, 20:26): parked SUV = vehicle 0.42-0.45, PC executor 0.44."

