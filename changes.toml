[[items]]
id = "FEAT-yolo-decode"
kind = "feature"
title = "Shared YOLO decode for the hal_jzdl_* detectors, with per-class thresholds, anchors and class names"
part_of = ["GOAL-local-ai"]
why = "raptor-hal's JZDL backends decoded with a copy of the magik sample's loop: three heads at strides 8/16/32 and COCO anchors. Persondet-derived models (2 heads, strides 32 and 16, their own anchors), such as our person/pet/package models, were read out of bounds. The shared decode reads the head layout from the model's output trailer, and rvd gains [motion] class_thresholds, anchors_8/16/32 and class_names (a label per detection in ivs-detections)."
