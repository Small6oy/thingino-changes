# Thingino change register: every fix, feature and goal we carry across repos, and what each camera's
# builds must contain. One file; build.py turns it into the public page (index.html) and check.py
# verifies a source tree before it is installed on a camera (tools/xb runs it).
#
# Public: this file is published on GitHub. No IP addresses, LAN host names, local paths, passwords
# or household details (build.py refuses to build if it finds any).
#
# Kinds:   goal     an outcome built from features and fixes (HomeKit on Thingino)
#          feature  a capability that stands on its own, possibly across repos (faac 3.0)
#          fix      one bug, normally one repo and one commit
#          issue    a known bug without a fix yet
# Status:  active (goals) | local (only on our branches) | in-pr | unfixed | parked | dropped
#          Merged changes are removed from the register (upstream carries them) and their branches deleted.
#
# [[items]] fields: id, kind, title, why, status, devices, part_of (goal ids), depends (item ids),
#   prs (URLs), tested ("date, device: what"), notes, waiting_on (what it waits on: a merge, a reply, a decision;
#   required when status is parked) and then (the step once that clears), and [[items.repos]] blocks:
#   repo (a [[repos]] id), branch, commits (any one being an ancestor of the tree satisfies the check),
#   markers ([{file, text}]: all present in the working tree also satisfies it; survives cherry-picks
#   and uncommitted test patches), binaries (optional: only check this block when installing these, e.g.
#   ["rvd"]). An item without commits or markers can't be checked automatically.
#
# [[devices]] must: the items every build for that camera has to contain. check.py tests those whose
#   repo matches the trees being installed; a missing one blocks the install.

[meta]
title = "Thingino changes"
owner = "Small6oy"
updated = "2026-11-24"
intro = "Fixes, features and goals we carry on top of upstream Thingino, raptor, raptor-hal and the HomeKit daemon, what each camera's builds must contain, and where each change stands upstream."

