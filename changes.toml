# --- gtxaspec/qemu issues we took on 2026-11-22 (Ingenic emulator; no camera build depends on them) ---

[[items]]
id = "ISSUE-qemu-t41-f-noprogram"
kind = "issue"
title = "qemu: T41 NNA F writes with no WFCW program (0x5a = 0) differ from silicon (gtxaspec/qemu #63)"
why = "ingenic-nna treats 0x5a = 0 as one F line per 4-pixel slot (the same as the one-word program 0x801); a T41NQ writes F elsewhere. Code that relies on the default passes in the emulator and gives wrong sums on hardware."
status = "unfixed"
devices = ["wyze-cam-v4"]
prs = ["https://github.com/gtxaspec/qemu/pull/67"]
tested = "2026-11-24, Wyze Cam v4 vs ingenic-txx 05d871d66a, fprobe (identity weights, address-coded F): with the program both agree, without it they differ; NNCMD 0x60 is a no-op on both"
notes = "Issue: https://github.com/gtxaspec/qemu/issues/63 (no patch: silicon's rule for 0x5a = 0 is unknown). 2026-11-25 sweep (comment 7134683958): silicon placement depends on hidden state from earlier writes, one NNDWR with no program hangs the NN unit; proposed LOG_GUEST_ERROR instead of a rule. PR https://github.com/gtxaspec/qemu/pull/67 (log F writes with no WFCW program as a guest error; qtest 21/21, oracle output unchanged) landed 2026-11-25 by cherry-pick as 72b5947400, in ingenic-0.7.32; issue #63 stays open (no rule to model). onna always programs WFCW, so it is not affected. Same session confirmed upstream's ae58bace25 (T41 F RAM slices) against silicon address for address. Body: upstream/qemu/issue-t41-f-noprogram-body.md."

