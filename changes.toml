# Features

[[items]]
id = "FEAT-rhkd"
kind = "feature"
title = "rhkd: the HomeKit camera daemon"
why = "HomeKitADK-based daemon reading raptor's rings: live view (two RTP sessions), Opus audio, talkback with echo cancellation, motion sensor, HKSV over HomeKit Data Stream."
status = "local"
part_of = ["GOAL-homekit"]
devices = ["wyze-cam-v3", "wyze-cam-v4"]
tested = "2026-11-20, Wyze Cam v3 and v4: 0.9.7 from the flashed 2026-11-19 images; live view with audio on both. 2026-11-22, Wyze Cam v4 image 20261122-2250 and v3 image 20261122-2251: rhkd 0.9.10 built into the image"
notes = "Public v0.9.10 released 2026-11-20 (public main 21930ef; drops faac 2.x). 2026-11-22: public 9345ccf makes the repo's web UI manifest match the package copy (themactep's patch 0004 from the #2085 review); no release for it. Both cameras run 0.9.10 from their 2026-11-22 images. Ships in upstream Thingino through the thingino-rhkd package (#2085, merged 2026-11-22); the daemon itself is developed here, so it stays local."
[[items.repos]]
repo = "thingino-homekit"
branch = "main"
commits = ["783fd4f", "2755bf8"]

[[items]]
id = "FEAT-rvd-aux-stream"
kind = "feature"
title = "rvd: on-demand extra video streams (HomeKit aux) on spare framesource slots"
why = "An extra H.264 encoder per spare framesource slot ([stream2], our cameras name its ring \"aux\" with `ring = aux`) that only runs while something reads it, so HomeKit live view gets a matching size without retuning main or sub (which recordings and NVRs use). Keeps encoding a few seconds after the last reader so a quick reconnect doesn't restart it. Generalised 2026-11-24 from the hard-coded aux after the team asked for N streams where the hardware allows."
status = "in-pr"
waiting_on = "Review of raptor #103 (CI waits for maintainer approval)."
then = "thingino-raptor bump + refresh Thingino's digital-zoom patch (conflicts in rvd_ctrl.c do_stream_restart_ex, unless #87 merges first); drop it from the raptor integration branch. Optional: rhkd finds the ring through rvd `status` (`ring` field) instead of the name `aux`, so `ring = aux` stops being needed."
part_of = ["GOAL-homekit"]
devices = ["wyze-cam-v3", "wyze-cam-v4"]
prs = ["https://github.com/gtxaspec/raptor/pull/103"]
tested = "2026-11-19, Wyze Cam v3 (1280x720) and v4 (1920x1080): live view, resize during a session, linger. 2026-11-24, N-stream rvd on both (bind mount): v4 aux 1080p, 720p/1080p/1440p resize, privacy pause, main restart re-attach; v3 aux 720p, 1080p refused for rmem and rolled back with main untouched. test-all ASan/TSan 179/1/3 vs main 146/1/3."
notes = "Needs `ring = aux` in [stream2] of raptor.conf (both cameras have it since 2026-11-24; without it the ring is called stream2 and rhkd can't find it). Images built from 2026-11-24 take raptor from integration/2026-11-24 (rvd-extra-streams in place of rvd-aux-stream). The old hard-coded branch rvd-aux-stream (0def512) is superseded."
[[items.repos]]
repo = "raptor"
binaries = ["rvd"]
branch = "rvd-extra-streams"
commits = ["c6103bb", "0bbc04e"]
markers = [
  { file = "rvd/rvd_pipeline.c", text = "]: attached as stream" },
  { file = "rvd/rvd_frame_loop.c", text = "reader back within linger" },
]

[[items]]
id = "FEAT-rhkd-hksv3"
kind = "feature"
title = "rhkd: HKSV3 (iOS 27 secure video) for the Wyze Cam v4"
why = "iOS 27 adds a new camera service set: multi-tier RTP, WebRTC remote view with SFrame end-to-end encryption, motion zones, 4K stream and record. It could use raptor's native H.265 with no re-encode. rhkd's classic HKSV keeps working on iOS 27."
status = "parked"
waiting_on = "Owner decision (2026-11-18, 'try later'). The reference implementation, HAP-NodeJS PR #1132, isn't merged yet."
then = "Read Apple's HomeKit Secure Video Open Source Compatibility Guide and HAP-NodeJS #1132, then write a design note (services, what hds/recorder/fmp4 code is reusable, the WebRTC stack) before any code. Constraints: HEVC only, one path per accessory, hvc1 + prft in the fMP4. The Wyze Cam v3 stays classic."
part_of = ["GOAL-homekit"]
devices = ["wyze-cam-v4"]

[[items]]
id = "FEAT-rad-extra-outputs"
kind = "feature"
title = "rad: extra encoder outputs on the same capture"
why = "[audio2]/[audio3] give a second codec (AAC-LC for HKSV next to Opus for live view) from one microphone capture, on demand."
status = "in-pr"
waiting_on = "Review of raptor #88. It conflicts with #92 on one line of `rad/rad_codec_aac.c`; whichever lands second rebases."
then = "thingino-raptor bump; then remove the test rad the cameras carry. Once the package / rhkd-setup configures [audio2] opus + [audio3] aac and fails clearly without extra outputs: remove rhkd's audio transcoding fallback (aacpipe.c, opus/faac in deps.sh and build/Makefile, the fallback paths in recorder.c); keep libopus for talk-back."
part_of = ["GOAL-homekit"]
prs = ["https://github.com/gtxaspec/raptor/pull/88"]
tested = "2026-11-18, Wyze Cam v3 and v4. 2026-11-20, Wyze Cam v3 and v4: headroom bench with all three outputs running, up to Opus complexity 10 + AAC 96k + 100 % CPU load: no resyncs or lost audio, longest SDK read gap 66 ms against the 400 ms buffer (see FEAT-rad-encoder-workers)."
[[items.repos]]
repo = "raptor"
branch = "rad-second-codec"
commits = ["6751291"]

[[items]]
id = "FEAT-rad-encoder-workers"
kind = "feature"
title = "rad: encoder worker threads for the extra outputs (tested, not adopted)"
why = "rad captures and runs every encoder (audio, audio2, audio3) in one loop, so a slow encode could delay the next SDK read and lose audio. The experiment moved audio2/audio3 encoding onto worker threads (one shared, or one per output) to see whether the single loop needs that."
status = "dropped"
devices = ["wyze-cam-v3", "wyze-cam-v4"]
depends = ["FEAT-rad-extra-outputs"]
tested = "2026-11-20, Wyze Cam v3 and v4: inline vs one worker vs one worker per output, 2 reps each, idle / all three outputs / Opus complexity 10 + AAC 96k / plus 100 % CPU load, 2-minute measured runs; host ASan and TSan with reader churn against audio-restart and ai-disable/ai-enable."
notes = "Result: the single loop is enough. No resyncs or lost audio in any variant; the longest SDK read gap was about 60 ms (T31) / 45 ms (T41) against the 400 ms buffer, the same with or without workers. Workers only shorten the capture thread's time per chunk (T31 heavy p99 15 to 8-10 ms), at the same total CPU, +60-150 kB RSS and slightly more delivery jitter. Revisit only if encode work per chunk grows about tenfold. Test code was never meant for upstream and is not on any public branch."

[[items]]
id = "FEAT-faac3"
kind = "feature"
title = "faac 3.0 across the stack"
part_of = ["GOAL-aac-update"]
why = "Move AAC encoding to faac 3.0's API (ABI 3) and replace Helix AAC decoding with the libfaad3 bundled in faac 3.0; saves about 42 KB of flash on the v4 (faac 2.2 + helix-aac 180 KB, faac 3.0 + faad3 138 KB)."
status = "in-pr"
waiting_on = "raptor #92 review and merge (every review comment answered on 2026-11-20: TNS on in rad and rsp, PCM buffers sized from libfaad3; no reply since). The firmware decoder option, thingino-firmware #2142, merged on 2026-11-22 (793c48917), and faac #152 merged the same day. Upstream Thingino already ships faac 3.0 itself (90e92fc4a), so what is left is draft #2143 (raptor selects libfaad3 in place of libhelix-aac); themactep merged master, which has #2142, into it on 2026-11-22 (5a7ee8f4f)."
then = "After #92 merges: in #2143 bump THINGINO_RAPTOR_VERSION to the merged commit and delete 0002-faac-3-abi.patch, build v3 and v4 images, add the flash numbers, mark it ready. rhkd needs nothing more: it dropped faac 2.x in v0.9.10 (2026-11-20), which #2085 pins."
prs = ["https://github.com/gtxaspec/raptor/pull/92", "https://github.com/themactep/thingino-firmware/pull/2142", "https://github.com/themactep/thingino-firmware/pull/2143", "https://github.com/FreewareAdvancedAudio/faac/pull/152"]
tested = "2026-11-19, Wyze Cam v3 and v4: rad (on rad-second-codec) encodes [audio] and [audio3] AAC-LC on faac 3.0 with identical ASC and frame rate; rsd backchannel decodes real AAC with faad3 (same PCM frame count as Helix); rwd turns the AAC ring into WebRTC Opus via faad3. Temporary bind mounts, reverted. raptor test suite matches upstream main. 2026-11-20: v3 and v4 images with faac 3.0 and libfaad3 (no Helix) flashed and running. 2026-11-20 13:22: both cameras got libfaac/libfaad3 from the rebased branch (-fno-math-errno instead of -ffast-math) in the overlay; RTSP AAC, WebRTC via faad3 and the ONVIF AAC backchannel pass; rad CPU unchanged (v3 9.1 to 9.2 %, v4 2.6 to 2.2 %). faac master vs faac#151 on the cameras: 4.0x (T31) and 5.0x (T41) less encode CPU at 96 kbit/s, output byte-identical (thingino-firmware #2121 comment). 2026-11-20 17:05, v3 and v4: #92 review follow-up a99b440 (rsd, rsp and rwd size their PCM output from faad_decoder_get_info().max_output_bytes): ONVIF AAC backchannel gives 17 x 2048-byte mono frames on the speaker ring for 17 AUs, rwd WebRTC Opus and an rsp RTMP push (16 kHz AAC to 48 kHz AAC-LC) each deliver 10 s of audio with every sample present; same as the image binaries. ASan suite unchanged. Temporary bind mounts, reverted."
notes = "Stands on its own; touches HomeKit only through rhkd's AAC pipe. faac's uClibc fix (endian.h rename, faac #150) and -fno-math-errno (#151) are merged upstream; prudynt-t and timps get ABI 3 patches. Firmware must bump thingino-raptor to a raptor with this change in the same step."
